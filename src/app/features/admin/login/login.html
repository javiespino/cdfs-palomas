<div class="login-wrapper">
  <div class="login-card">
    <img src="escudo.png" alt="CDFS Palomas" class="login-escudo" />
    <h2>Acceso administrador</h2>
    <p class="login-subtitle">CDFS Palomas</p>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" placeholder="admin@cdfspalomas.es" />
    </div>

    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <div class="input-wrapper">
        <input id="contrasena" [type]="verContrasena() ? 'text' : 'password'" [(ngModel)]="contrasena" />
        <button type="button" class="ver-btn" (click)="verContrasena.set(!verContrasena())">
          {{ verContrasena() ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <button class="btn-login" (click)="onSubmit()" [disabled]="cargando()">
      {{ cargando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </div>
</div>
